name: Deploy Guide

on:
  push:
    branches:
      - main
      - 'v*'
    paths:
      - apps/guide/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy Guide to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Determine destination directory
        id: dest
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "dir=guide" >> $GITHUB_OUTPUT
          else
            echo "dir=guide@${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      # build docs to avoid depending on the Typedoc deploy having finished first,
      # since the guide links entities from build/docs/entities.json
      - name: Build packages
        run: pnpm turbo run build --filter="./packages/*"

      - name: Build Typedoc
        run: pnpm typedoc

      - name: Build website
        run: pnpm turbo run build --filter=@nyx-discord/guide
        env:
          NEXT_PUBLIC_BASE_PATH: /nyx/${{ steps.dest.outputs.dir }}
          NYX_DOCS_ENTITIES_SOURCE: local

      # Popular action to deploy to GitHub Pages:
      # Docs: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-docusaurus
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Build output
          publish_dir: ./apps/guide/out
          publish_branch: gh-pages
          destination_dir: ${{ steps.dest.outputs.dir }}
          # The following lines assign commit authorship to the official
          # GH-Actions bot for deploys to `gh-pages` branch:
          # https://github.com/actions/checkout/issues/13#issuecomment-724415212
          # The GH actions bot is used by default if you didn't specify the two fields.
          # You can swap them out with your own user credentials.
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
