name: Deploy Typedoc

on:
  push:
    branches:
      - main
      - 'v*'
    paths:
      - packages/**/src/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy Typedoc to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Use pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build base
        run: pnpm exec lerna run build --scope=@nyx-discord/base

      - name: Build docs
        run: pnpm exec docs

      - name: Determine destination directory
        id: dest
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "dir=docs" >> $GITHUB_OUTPUT
          else
            echo "dir=docs@${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Build output
          publish_dir: ./build/docs
          publish_branch: gh-pages
          destination_dir: ${{ steps.dest.outputs.dir }}
          # The following lines assign commit authorship to the official
          # GH-Actions bot for deploys to `gh-pages` branch:
          # https://github.com/actions/checkout/issues/13#issuecomment-724415212
          # The GH actions bot is used by default if you didn't specify the two fields.
          # You can swap them out with your own user credentials.
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
