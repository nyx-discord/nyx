name: Create Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Bump Type'
        required: true
        default: 'conventional'
        # from-package: skip versioning and publish the versions already in each
        # package.json that aren't on the registry yet (e.g. first publishes)
        type: choice
        options:
          - conventional
          - patch
          - minor
          - major
          - from-package

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js with GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm turbo run build --filter="./packages/*"

      - name: Run versioning
        if: ${{ github.event.inputs.version != 'from-package' }}
        run: |
          git config --global user.email "${GIT_AUTHOR_EMAIL}"
          git config --global user.name "${GIT_AUTHOR_NAME}"
          pnpm run ci:version:${{ github.event.inputs.version }}
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release to GitHub Packages
        run: |
          git config --global user.email "${GIT_AUTHOR_EMAIL}"
          git config --global user.name "${GIT_AUTHOR_NAME}"
          pnpm run ci:publish:github:${{ github.event.inputs.version == 'from-package' && 'from-package' || 'from-git' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js with NPM Registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release to NPM Registry
        run: |
          echo "@nyx-discord:registry=https://registry.npmjs.org" >> .npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
          pnpm run ci:publish:npm:${{ github.event.inputs.version == 'from-package' && 'from-package' || 'from-git' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
